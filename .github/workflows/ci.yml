name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd ts && npm ci --include=dev && ./node_modules/.bin/tsc --noEmit

  live:
    # Runs the loop against the real API. Needs ANTHROPIC_API_KEY as a repo secret.
    needs: unit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DAYFLOW_LIVE: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_live.py
      # Lesson 89: the eval suites. Code graders only in CI; 3 trials is a smoke
      # signal, not a measurement. Run `dayflow eval -n 10` locally before a release.
      - run: python -m dayflow.main eval -n 3 --no-judge
