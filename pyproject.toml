[project]
name = "dayflow"
version = "0.81.0"
description = "Dayflow - the personal ops agent built across Learn2Exel Level 10 (Agentic AI Engineer)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.60",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dayflow = "dayflow.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dayflow*"]
